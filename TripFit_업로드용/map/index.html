</style><!-- 페이지 전환: 하단 탭바로 이동할 때만 탭 순서에 따라 옆으로 슬라이드 (View Transitions, 미지원 브라우저는 들어오는 쪽만 슬라이드) -->
<style>
  @view-transition { navigation: auto; }
  header { view-transition-name: tf-header; }
  nav.fixed { view-transition-name: tf-tabbar; }
  ::view-transition-group(tf-header), ::view-transition-group(tf-tabbar) { animation-duration: .2s; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .38s; animation-timing-function: cubic-bezier(.32, .72, 0, 1); animation-fill-mode: both; }
  /* 앞으로: 두 화면이 나란히 붙은 채 왼쪽으로 함께 넘어감 (이전 화면 → 왼쪽 밖, 새 화면 ← 오른쪽에서) */
  html:active-view-transition-type(tf-forward)::view-transition-old(root) { animation-name: tf-push-out; }
  html:active-view-transition-type(tf-forward)::view-transition-new(root) { animation-name: tf-slide-in; }
  /* 뒤로: 두 화면이 나란히 붙은 채 오른쪽으로 함께 넘어감 */
  html:active-view-transition-type(tf-back)::view-transition-old(root) { animation-name: tf-slide-out; }
  html:active-view-transition-type(tf-back)::view-transition-new(root) { animation-name: tf-pop-in; }
  @keyframes tf-slide-in { from { transform: translateX(100%); } }
  @keyframes tf-push-out { to { transform: translateX(-100%); } }
  @keyframes tf-slide-out { to { transform: translateX(100%); } }
  @keyframes tf-pop-in { from { transform: translateX(-100%); } }
  /* 미지원 브라우저용: 새 화면 본문만 옆에서 들어옴 */
  html.tf-enter-forward main { animation: tf-fb-right .38s cubic-bezier(.32, .72, 0, 1) both; }
  html.tf-enter-back main { animation: tf-fb-left .38s cubic-bezier(.32, .72, 0, 1) both; }
  @keyframes tf-fb-right { from { transform: translateX(40px); opacity: 0; } }
  @keyframes tf-fb-left { from { transform: translateX(-40px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    @view-transition { navigation: none; }
    html.tf-enter-forward main, html.tf-enter-back main { animation: none; }
  }
</style>
<script>
  (function () {
    // 하단 탭바로 이동할 때만 탭 순서대로 슬라이드. 그 외 이동(버튼·뒤로 가기·자동 이동)은 전환 없이 바로 바뀜
    const ORDER = { home: 0, 'ai': 1, map: 2, shop: 3 };
    const pageOf = (url) => { try { const parts = new URL(url, location.href).pathname.split('/'); return decodeURIComponent(parts[parts.length - 2] || ''); } catch (e) { return ''; } };
    const KEY = 'tf-nav-dir';
    const take = () => { try { const v = sessionStorage.getItem(KEY); sessionStorage.removeItem(KEY); return v; } catch (e) { return null; } };

    // 탭바 링크를 누른 순간 방향을 기록
    document.addEventListener('click', (e) => {
      const a = e.target.closest && e.target.closest('nav.fixed a[href]');
      if (!a) return;
      const from = ORDER[pageOf(location.href)], to = ORDER[pageOf(a.href)];
      if (from === undefined || to === undefined || from === to) return;
      try { sessionStorage.setItem(KEY, to > from ? 'tf-forward' : 'tf-back'); } catch (err) { /* 무시 */ }
    }, true);

    // 지원 브라우저: 탭바 이동이면 방향 타입 지정, 아니면 전환 생략
    window.addEventListener('pageswap', (e) => {
      if (!e.viewTransition) return;
      e.viewTransition.ready.catch(() => {});
      let dir = null;
      try { dir = sessionStorage.getItem(KEY); } catch (err) { /* 무시 */ }
      if (dir) e.viewTransition.types.add(dir); else e.viewTransition.skipTransition();
    });
    window.addEventListener('pagereveal', (e) => {
      if (!e.viewTransition) return;
      e.viewTransition.ready.catch(() => {});
      const dir = take();
      if (dir) e.viewTransition.types.add(dir); else e.viewTransition.skipTransition();
    });

    // 미지원 브라우저: 탭바로 들어온 경우만 본문을 옆에서 슬라이드
    if (!('CSSViewTransitionRule' in window)) {
      const dir = take();
      if (dir === 'tf-forward') document.documentElement.classList.add('tf-enter-forward');
      if (dir === 'tf-back') document.documentElement.classList.add('tf-enter-back');
    }
  })();
</script>

  const state = { route: 'royal', mode: 'walk', showOthers: true, mapStyle: 'standard', openSpot: null };

  const $ = (sel) => document.querySelector(sel);
  const ll = (id) => [SPOTS[id].lat, SPOTS[id].lng];
  function dist(a, b) {
    const R = 6371000, A = SPOTS[a], B = SPOTS[b], rad = Math.PI / 180;
    const dLat = (B.lat - A.lat) * rad, dLng = (B.lng - A.lng) * rad;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(A.lat * rad) * Math.cos(B.lat * rad) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h)) * ROAD_FACTOR;
  }

  const fmtClock = (min) => { let h = Math.floor(min / 60), m = Math.round(min % 60); if (m === 60) { h++; m = 0; } const ap = h < 12 ? 'AM' : 'PM'; const h12 = ((h + 11) % 12) + 1; return `${String(h12).padStart(2, '0')}:${String(m).padStart(2, '0')} ${ap}`; };
  const legMin = (m) => { const md = MODES[state.mode]; return Math.max(1, Math.round((m / 1000) / md.kmh * 60 + md.wait)); };

  function plan(routeId = state.route) {
    const stops = ROUTES[routeId].stops;
    let t = START_MIN, total = 0;
    const items = stops.map((id, i) => {
      const leg = i < stops.length - 1 ? dist(id, stops[i + 1]) : 0;
      const item = { id, arrive: t, leg, legMin: leg ? legMin(leg) : 0 };
      t += SPOTS[id].stay + item.legMin;
      total += leg;
      return item;
    });
    // 비용 = 코스 기본가(한복 대여) + 경유지별 스냅 촬영 연동비 + 장소 요금 + 이동 수단
    const cost = ROUTES[routeId].base + (stops.length - 2) * STOP_FEE
      + stops.reduce((sum, id) => sum + (SPOTS[id].price || 0), 0) + MODES[state.mode].cost(items.slice(0, -1).map((it) => it.leg));
    return { items, total, duration: t - START_MIN, cost };
  }

  // 모든 장소를 정확히 지나는 부드러운 곡선 (centripetal Catmull-Rom: 고리·튀어나감 없음)
  function curve(ids, steps = 16) {
    const p = ids.map(ll).map(([la, ln]) => [ln * Math.cos(la * Math.PI / 180), la]); // 경도 보정한 평면 좌표
    if (p.length < 3) return ids.map(ll);
    const d = (a, b) => Math.max(1e-9, Math.sqrt(Math.hypot(b[0] - a[0], b[1] - a[1])));
    const lerp = (a, b, t0, t1, t) => [(t1 - t) / (t1 - t0) * a[0] + (t - t0) / (t1 - t0) * b[0], (t1 - t) / (t1 - t0) * a[1] + (t - t0) / (t1 - t0) * b[1]];
    const out = [p[0]];
    for (let i = 0; i < p.length - 1; i++) {
      const p0 = p[i - 1] || [2 * p[0][0] - p[1][0], 2 * p[0][1] - p[1][1]];
      const p1 = p[i], p2 = p[i + 1];
      const p3 = p[i + 2] || [2 * p2[0] - p1[0], 2 * p2[1] - p1[1]];
      const t0 = 0, t1 = t0 + d(p0, p1), t2 = t1 + d(p1, p2), t3 = t2 + d(p2, p3);
      for (let k = 1; k <= steps; k++) {
        const t = t1 + (t2 - t1) * k / steps;
        const a1 = lerp(p0, p1, t0, t1, t), a2 = lerp(p1, p2, t1, t2, t), a3 = lerp(p2, p3, t2, t3, t);
        const b1 = lerp(a1, a2, t0, t2, t), b2 = lerp(a2, a3, t1, t3, t);
        out.push(lerp(b1, b2, t1, t2, t));
      }
    }
    return out.map(([x, la]) => [la, x / Math.cos(la * Math.PI / 180)]);
  }

  // ───── 지도 ─────
  const CONTROLS_W = 60; // 오른쪽 지도 버튼 열
  const map = L.map('map', {
    zoomControl: false,
    attributionControl: true,
    minZoom: 13,
    maxZoom: 19,
    zoomSnap: 0.25,
    maxBounds: [[35.76, 127.08], [35.87, 127.22]],
    maxBoundsViscosity: 0.8,
  });
  map.attributionControl.setPrefix(false);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors',
  }).addTo(map);
  function applyMapStyle() {
    map.getPane('tilePane').style.filter = MAP_STYLES[state.mapStyle].filter;
    $('#map').classList.toggle('is-night', state.mapStyle === 'night');
  }

  const routeLayer = L.layerGroup().addTo(map);
  const pinLayer = L.layerGroup().addTo(map);

  const visibleCenterY = () => { const H = map.getSize().y; return (100 + (H - 70)) / 2 + 20; };
  // 검색창·코스 버튼·오른쪽 버튼을 피한 영역 가운데에 장소가 오도록 이동
  function focusSpot(id, minZoom = 17) {
    const z = Math.max(map.getZoom(), minZoom), size = map.getSize();
    const target = L.point((size.x - CONTROLS_W) / 2, visibleCenterY());
    const center = map.project(ll(id), z).add(L.point(size.x / 2, size.y / 2).subtract(target));
    map.flyTo(map.unproject(center, z), z, { duration: 0.6 });
  }
  function fitRoute(animate = true) {
    const bounds = L.latLngBounds(ROUTES[state.route].stops.map(ll));
    map.fitBounds(bounds, { paddingTopLeft: [70, 240], paddingBottomRight: [CONTROLS_W + 50, 110], animate, duration: 0.6, maxZoom: 17.5 });
  }

  function updateZoomButtons() {
    $('#btnZoomIn').disabled = map.getZoom() >= map.getMaxZoom();
    $('#btnZoomOut').disabled = map.getZoom() <= map.getMinZoom();
  }
  map.on('zoomend', updateZoomButtons);
  $('#btnZoomIn').addEventListener('click', () => map.zoomIn(1));
  $('#btnZoomOut').addEventListener('click', () => map.zoomOut(1));
  $('#btnLocate').addEventListener('click', () => {
    focusSpot('onhanbok', 17.5);
    toast('현재 위치: 온한복 본점 근처');
  });

  // ───── 경로 / 핀 그리기 ─────
  function renderRoutes(animate) {
    routeLayer.clearLayers();
    if (state.showOthers) {
      for (const id in ROUTES) {
        if (id === state.route) continue;
        L.polyline(curve(ROUTES[id].stops), { color: ROUTES[id].color, weight: 3.5, opacity: 0.5, dashArray: '5 6', lineCap: 'round', interactive: false, className: 'route-ghost' }).addTo(routeLayer);
      }
    }
    const r = ROUTES[state.route], pts = curve(r.stops);
    const glow = L.polyline(pts, { color: r.color, weight: 11, opacity: 0.25, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(routeLayer);
    const main = L.polyline(pts, { color: r.color, weight: 5, opacity: 1, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(routeLayer);
    const dots = L.polyline(pts, { color: '#ffffff', weight: 2, opacity: 0.95, dashArray: '2 9', lineCap: 'round', interactive: false }).addTo(routeLayer);
    if (animate) {
      [glow, main].forEach((layer) => {
        const p = layer.getElement(), len = p.getTotalLength();
        p.style.strokeDasharray = `${len} ${len}`;
        p.style.strokeDashoffset = len;
        p.getBoundingClientRect();
        p.style.transition = 'stroke-dashoffset .7s cubic-bezier(.4,0,.2,1)';
        p.style.strokeDashoffset = '0';
        p.addEventListener('transitionend', () => { p.style.strokeDasharray = ''; p.style.strokeDashoffset = ''; p.style.transition = ''; }, { once: true });
      });
      const d = dots.getElement();
      d.style.opacity = '0';
      d.style.transition = 'opacity .3s ease .6s';
      requestAnimationFrame(() => { d.style.opacity = '1'; });
    }
  }

  function pinHtml(id) {
    const sp = SPOTS[id], stops = ROUTES[state.route].stops, idx = stops.indexOf(id), on = idx >= 0;
    const isStart = idx === 0, isEnd = idx === stops.length - 1;
    let label = '';
    if (on) {
      if (isStart) label = `<div class="px-2.5 py-1 rounded-full bg-ink-primary text-white shadow-md flex items-center gap-1.5 mb-1.5 border border-white/20"><span class="w-1.5 h-1.5 rounded-full bg-[#34c759]"></span><span class="text-[11px] font-semibold tracking-tight whitespace-nowrap">${sp.name}</span></div>`;
      else if (isEnd) label = `<div class="px-2.5 py-1 rounded-full text-white shadow-md flex items-center gap-1 mb-1 border border-white/20" style="background:${ROUTES[state.route].color}"><span class="material-symbols-outlined text-[12px]">flag</span><span class="text-[11px] font-semibold whitespace-nowrap">${sp.name}</span></div>`;
      else label = `<div class="px-2.5 py-1 rounded-full bg-white/95 backdrop-blur-md text-ink-primary shadow-md flex items-center gap-1.5 mb-1 border border-black/5"><span class="w-4 h-4 rounded-full text-white text-[9px] font-bold flex items-center justify-center" style="background:${sp.color}">${idx + 1}</span><span class="text-[11px] font-semibold whitespace-nowrap">${sp.name}</span></div>`;
    }
    const size = on ? (isStart || isEnd ? 28 : 24) : 22;
    const marker = on
      ? `<div class="relative flex items-center justify-center">${isStart ? '<span class="absolute w-7 h-7 rounded-full bg-primary/25 animate-ping"></span>' : ''}<div class="pin-dot rounded-full text-white flex items-center justify-center shadow-lg border-[2px] border-white" style="width:${size}px;height:${size}px;background:${sp.color}"><span class="material-symbols-outlined" style="font-size:${size * 0.52}px">${sp.icon}</span></div></div>`
      : `<div class="pin-dot rounded-full bg-white flex items-center justify-center shadow-md border border-black/10" style="width:${size}px;height:${size}px;color:${sp.color}"><span class="material-symbols-outlined" style="font-size:12px">${sp.icon}</span></div>`;
    return `<div class="pin-inner flex flex-col items-center">${label}${marker}</div>`;
  }

  function renderPins() {
    pinLayer.clearLayers();
    const stops = ROUTES[state.route].stops;
    for (const id in SPOTS) {
      const on = stops.includes(id), sel = state.openSpot === id;
      const m = L.marker(ll(id), {
        icon: L.divIcon({ className: 'map-pin' + (on ? ' is-on' : '') + (sel ? ' is-selected' : ''), html: pinHtml(id), iconSize: [0, 0], iconAnchor: [0, 0] }),
        zIndexOffset: sel ? 2000 : on ? 1000 : 0,
        keyboard: true,
        title: `${SPOTS[id].name} 상세 보기`,
        riseOnHover: true,
      });
      m.on('click', () => openSpot(id));
      m.addTo(pinLayer);
    }
  }

  // ───── 코스 선택 버튼 ─────
  function renderRoutePills() {
    $('#routePills').innerHTML = Object.entries(ROUTES).map(([id, r]) => {
      const on = id === state.route;
      return on
        ? `<button type="button" data-route="${id}" aria-pressed="true" class="shrink-0 whitespace-nowrap px-3.5 py-1.5 rounded-full text-white text-[12px] font-semibold flex items-center gap-1.5 border border-white/20 active:scale-95 transition-all" style="background:${r.color};box-shadow:0 4px 14px ${r.color}59"><span class="w-1.5 h-1.5 rounded-full bg-white"></span><span>${r.label}</span></button>`
        : `<button type="button" data-route="${id}" aria-pressed="false" class="shrink-0 whitespace-nowrap px-3.5 py-1.5 rounded-full bg-white/90 backdrop-blur-xl text-ink-secondary text-[12px] font-medium shadow-sm border border-[rgba(210,210,215,0.64)] flex items-center gap-1.5 hover:text-ink-primary active:scale-95 transition-all"><span class="w-1.5 h-1.5 rounded-full" style="background:${r.color}"></span><span>${r.label}</span></button>`;
    }).join('');
    // 선택된 코스 버튼이 보이도록 가로 스크롤
    const on = $('#routePills [aria-pressed="true"]');
    if (on) $('#routePills').scrollTo({ left: on.offsetLeft - 14, behavior: 'smooth' });
  }
  $('#routePills').addEventListener('click', (e) => {
    const b = e.target.closest('[data-route]');
    if (b) setRoute(b.dataset.route);
  });

  function setRoute(id) {
    if (id === state.route) { fitRoute(); return; }
    state.route = id;
    const far = ROUTES[id].farMode;
    if (far && state.mode === 'walk') {
      state.prevMode = state.mode; state.mode = far;
      toast('거리가 멀어 이동 수단을 택시로 바꿨어요');
    } else if (!far && state.prevMode) {
      state.mode = state.prevMode; state.prevMode = null;
    }
    renderAll(true);
    fitRoute();
  }

  // ───── 하단 코스 상세 ─────
  function renderSheet() {
    const r = ROUTES[state.route], p = plan(), md = MODES[state.mode];
    $('#routeBadge').textContent = r.badge;
    $('#routeBadge').style.color = r.color;
    $('#routeBadge').style.background = r.color + '1a';
    $('#routeRating').textContent = r.rating;
    $('#routeDone').textContent = `(${r.done}명 완주)`;
    $('#routeTitle').textContent = r.title;
    $('#routeSub').textContent = r.sub;
    $('#sumDist').textContent = fmtDist(p.total);
    $('#sumTime').textContent = fmtDur(p.duration);
    $('#sumTimeIcon').textContent = md.icon;
    $('#sumCost').textContent = won(p.cost);
    $('#stopCount').textContent = `코스 일정 · ${p.items.length}곳 · ${md.label}`;

    const n = p.items.length;
    $('#timeline').innerHTML = p.items.map((it, i) => {
      const sp = SPOTS[it.id], last = i === n - 1;
      const prefix = i === 0 ? '출발 · ' : last ? '도착 · ' : '';
      const photos = sp.photos ? `<div class="grid grid-cols-2 gap-2 mt-2.5">${sp.photos.map(([k, t]) => `<div class="flex items-center gap-2 p-1.5 rounded-[8px] bg-canvas-parchment border border-[rgba(0,0,0,0.04)]"><div class="w-9 h-9 rounded-[8px] bg-cover bg-center shrink-0 border border-black/5" style="background-image:url('${PHOTOS[k]}')"></div><span class="text-[12px] font-medium text-ink-primary truncate">${t}</span></div>`).join('')}</div>` : '';
      const tags = sp.tags.length ? `<div class="flex flex-wrap items-center gap-1.5 mt-2">${sp.tags.map((t, j) => `<span class="px-2 py-0.5 rounded-md text-[11px] ${last && j === 0 ? 'bg-[#e8f2ff] text-primary font-semibold' : 'bg-canvas-parchment text-ink-secondary font-medium border border-[rgba(0,0,0,0.04)]'}">${t}</span>`).join('')}</div>` : '';
      const leg = last ? '' : `<div class="flex items-center gap-1 mt-2.5 text-[11px] text-ink-muted"><span class="material-symbols-outlined text-[14px]">${md.icon}</span><span>다음 장소까지 ${md.label} ${it.legMin}분 · ${fmtDist(it.leg)}</span></div>`;
      return `<div class="timeline-item flex items-start gap-3 relative ${last ? '' : 'pb-5'}">
        <div class="flex flex-col items-center">
          <div class="w-6 h-6 rounded-full text-white flex items-center justify-center text-[11px] font-bold shadow-sm z-10" style="background:${sp.color}">${i + 1}</div>
          ${last ? '' : '<div class="w-[2px] h-full bg-[#e5e5ea] absolute top-6 left-3 -translate-x-1/2"></div>'}
        </div>
        <div class="flex flex-col flex-1 pt-0 min-w-0">
          <button type="button" data-spot="${it.id}" class="text-left -m-1 p-1 rounded-[8px] hover:bg-black/[0.03] active:scale-[0.99] transition-all">
            <div class="flex items-center justify-between gap-2">
              <span class="text-[15px] font-semibold text-ink-primary truncate">${sp.name}</span>
              <span class="text-[12px] shrink-0 ${i === 0 ? 'font-semibold text-primary' : 'font-medium text-ink-muted'}">${fmtClock(it.arrive)}</span>
            </div>
            <p class="text-[13px] text-ink-muted mt-0.5 leading-snug">${prefix}${sp.desc}</p>
          </button>
          ${photos}${tags}${leg}
        </div>
      </div>`;
    }).join('');
  }
  $('#timeline').addEventListener('click', (e) => {
    const b = e.target.closest('[data-spot]');
    if (!b) return;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    focusSpot(b.dataset.spot);
    openSpot(b.dataset.spot);
  });

  // ───── 시트(장소 상세 / 코스 옵션) ─────
  function openSheet(id) {
    const el = $('#' + id);
    el.classList.remove('hidden');
    requestAnimationFrame(() => el.classList.add('is-open'));
  }
  function speak(btn) {
    const synth = window.speechSynthesis;
    if (!synth) { toast('이 기기에서는 음성 해설을 지원하지 않아요'); return; }
    const label = btn.querySelector('span:last-child'), icon = btn.querySelector('.material-symbols-outlined');
    if (synth.speaking) { synth.cancel(); return; }
    const T = window.TF_T || ((x) => x), en = window.TF_LANG === 'en';
    const u = new SpeechSynthesisUtterance(T(SPOTS[btn.dataset.speak].name) + '. ' + T(HISTORY[btn.dataset.speak]));
    u.lang = en ? 'en-US' : 'ko-KR'; u.rate = 1;
    const voice = synth.getVoices().find((v) => v.lang && v.lang.startsWith(en ? 'en' : 'ko'));
    if (voice) u.voice = voice;
    u.onstart = () => { label.textContent = '멈추기'; icon.textContent = 'stop_circle'; };
    u.onend = u.onerror = () => { label.textContent = '해설 듣기'; icon.textContent = 'volume_up'; };
    synth.speak(u);
  }
  function closeSheet(id) {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    const el = $('#' + id);
    el.classList.remove('is-open');
    setTimeout(() => el.classList.add('hidden'), 260);
    if (id === 'spotSheet' && state.openSpot) { state.openSpot = null; renderPins(); }
  }
  document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => closeSheet(b.dataset.close)));
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    ['spotSheet', 'optionSheet'].forEach((id) => { if (!$('#' + id).classList.contains('hidden')) closeSheet(id); });
  });

  function openSpot(id) {
    state.openSpot = id;
    renderPins();
    renderSpotSheet();
    openSheet('spotSheet');
  }

  function renderSpotSheet() {
    const id = state.openSpot, sp = SPOTS[id];
    if (!sp) return;
    const stops = ROUTES[state.route].stops, idx = stops.indexOf(id);
    const fixed = idx === 0 || idx === stops.length - 1;
    const p = plan(), item = p.items.find((it) => it.id === id);
    const hero = sp.photos
      ? `<div class="grid grid-cols-2 gap-2">${sp.photos.map(([k, t]) => `<div class="relative h-28 rounded-[8px] bg-cover bg-center overflow-hidden" style="background-image:url('${PHOTOS[k]}')"><span class="absolute left-1.5 bottom-1.5 px-1.5 py-0.5 rounded-md bg-black/50 text-white text-[10px] font-medium">${t}</span></div>`).join('')}</div>`
      : `<div class="h-24 rounded-[18px] flex items-center justify-center" style="background:${sp.color}14"><div class="w-14 h-14 rounded-full text-white flex items-center justify-center border-[3px] border-white shadow-md" style="background:${sp.color}"><span class="material-symbols-outlined text-[28px]">${sp.icon}</span></div></div>`;
    const status = idx >= 0
      ? `<div class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-[12px] font-medium" style="background:${ROUTES[state.route].color}12;color:${ROUTES[state.route].color}"><span class="material-symbols-outlined text-[16px]">route</span>${ROUTES[state.route].label}의 ${idx + 1}번째 장소 · ${fmtClock(item.arrive)} 도착 · ${sp.stay}분 머무름</div>`
      : `<div class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-canvas-parchment text-ink-secondary text-[12px] font-medium"><span class="material-symbols-outlined text-[16px]">info</span>현재 코스에 포함되지 않은 장소예요</div>`;
    const row = (icon, k, v) => `<div class="flex items-center gap-3 py-2.5 border-b border-[rgba(0,0,0,0.06)] last:border-0"><span class="material-symbols-outlined text-[18px] text-ink-muted">${icon}</span><span class="text-[13px] text-ink-muted w-16 shrink-0">${k}</span><span class="text-[14px] text-ink-primary font-medium">${v}</span></div>`;
    let action;
    if (sp.only && sp.only !== state.route) action = `<button type="button" data-goto-route="${sp.only}" class="flex-1 h-12 rounded-full text-white text-[15px] font-semibold active:scale-95 transition-transform flex items-center justify-center gap-1" style="background:${ROUTES[sp.only].color}"><span class="material-symbols-outlined text-[18px]">route</span>${ROUTES[sp.only].label} 코스로 보기</button>`;
    else if (fixed) action = `<button type="button" disabled class="flex-1 h-12 rounded-full bg-canvas-parchment text-ink-muted text-[15px] font-semibold">${idx === 0 ? '코스 출발지' : '코스 도착지'}</button>`;
    else if (idx >= 0) action = `<button type="button" data-toggle-stop="${id}" class="flex-1 h-12 rounded-full border border-primary text-primary text-[15px] font-semibold active:scale-95 transition-transform flex items-center justify-center gap-1"><span class="material-symbols-outlined text-[18px]">remove_circle</span>코스에서 빼기</button>`;
    else action = `<button type="button" data-toggle-stop="${id}" class="flex-1 h-12 rounded-full bg-primary text-white text-[15px] font-semibold active:scale-95 transition-transform flex items-center justify-center gap-1 shadow-[0_4px_16px_rgba(0,102,204,0.32)]"><span class="material-symbols-outlined text-[18px]">add_circle</span>이 코스에 추가</button>`;

    $('#spotBody').innerHTML = `
      ${hero}
      <div class="flex items-center gap-1.5 mt-4 mb-1"><span class="px-2 py-0.5 rounded-md text-[11px] font-bold" style="background:${sp.color}1a;color:${sp.color === '#1d1d1f' || sp.color === '#333333' ? '#1d1d1f' : sp.color}">${sp.cat}</span></div>
      <h3 id="spotTitle" class="text-[21px] font-bold text-ink-primary tracking-[-0.015em]">${sp.name}</h3>
      <p class="text-[14px] text-ink-muted mt-1 leading-snug">${sp.desc}</p>
      <div class="mt-3">${status}</div>
      <div class="mt-2">${row('schedule', '운영시간', sp.hours)}${row('payments', '요금', sp.fee)}${row('checkroom', '한복 혜택', sp.perk)}</div>
      ${HISTORY[id] ? `<div class="mt-3 p-3.5 rounded-2xl bg-[#f5f5f7]">
        <div class="flex items-center justify-between mb-1.5">
          <span class="flex items-center gap-1 text-[13px] font-semibold text-ink-primary"><span class="material-symbols-outlined text-[17px] text-primary">history_edu</span>문화 해설</span>
          <button type="button" data-speak="${id}" aria-label="문화 해설 음성으로 듣기" class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-white text-[12px] font-medium text-primary border border-black/[0.06] active:scale-95 transition-transform"><span class="material-symbols-outlined text-[15px]">volume_up</span><span>해설 듣기</span></button>
        </div>
        <p class="text-[13px] leading-relaxed text-ink-secondary">${HISTORY[id]}</p>
      </div>` : ''}
      <div class="flex items-center gap-2 mt-4">
        <button type="button" data-focus-spot="${id}" class="w-12 h-12 shrink-0 rounded-full bg-canvas-parchment text-ink-secondary flex items-center justify-center active:scale-95 transition-transform" aria-label="지도에서 보기"><span class="material-symbols-outlined text-[20px]">my_location</span></button>
        ${action}
      </div>`;
  }
  $('#spotBody').addEventListener('click', (e) => {
    const sp = e.target.closest('[data-speak]');
    if (sp) { speak(sp); return; }
    const t = e.target.closest('[data-toggle-stop]');
    if (t) {
      toggleStop(t.dataset.toggleStop);
      closeSheet('spotSheet');
      fitRoute();
      return;
    }
    const g = e.target.closest('[data-goto-route]');
    if (g) { closeSheet('spotSheet'); setRoute(g.dataset.gotoRoute); return; }
    const f = e.target.closest('[data-focus-spot]');
    if (f) {
      closeSheet('spotSheet');
      focusSpot(f.dataset.focusSpot, 17.5);
    }
  });

  // 경유지 추가 시 이동 거리가 가장 적게 늘어나는 위치에 끼워 넣음 (출발·도착은 고정)
  function toggleStop(id) {
    const stops = ROUTES[state.route].stops, idx = stops.indexOf(id);
    if (idx === 0 || idx === stops.length - 1) return idx >= 0;
    if (SPOTS[id].only && SPOTS[id].only !== state.route) return false;
    if (idx > 0) { stops.splice(idx, 1); renderAll(true); announceChange(id, false); return false; }
    let best = 1, bestCost = Infinity;
    for (let i = 1; i < stops.length; i++) {
      const c = dist(stops[i - 1], id) + dist(id, stops[i]) - dist(stops[i - 1], stops[i]);
      if (c < bestCost) { bestCost = c; best = i; }
    }
    stops.splice(best, 0, id);
    renderAll(true);
    announceChange(id, true);
    return true;
  }
  function announceChange(id, added) {
    const p = plan();
    toast(`${SPOTS[id].name} ${added ? '추가' : '제외'} · ${fmtDist(p.total)} · ${fmtDur(p.duration)} · ${won(p.cost)}`);
    renderOptionSummary();
  }

  // 코스 옵션 시트
  function seg(name, options, current) {
    return `<div class="grid gap-1 p-1 rounded-full bg-canvas-parchment" style="grid-template-columns:repeat(${Object.keys(options).length},1fr)">${Object.entries(options).map(([k, o]) =>
      `<button type="button" data-opt="${name}" data-val="${k}" class="h-9 rounded-full text-[13px] flex items-center justify-center gap-1 transition-all active:scale-95 ${k === current ? 'bg-white text-ink-primary font-semibold shadow-sm' : 'text-ink-muted font-medium'}">${o.icon ? `<span class="material-symbols-outlined text-[16px]">${o.icon}</span>` : ''}${o.label}</button>`).join('')}</div>`;
  }
  function renderOptionSheet() {
    const stops = ROUTES[state.route].stops;
    const start = SPOTS[stops[0]], end = SPOTS[stops[stops.length - 1]];
    const middle = Object.keys(SPOTS).filter((id) => id !== stops[0] && id !== stops[stops.length - 1] && (!SPOTS[id].only || SPOTS[id].only === state.route));
    $('#optionBody').innerHTML = `
      <section>
        <h4 class="text-[13px] font-semibold text-ink-muted mb-2">코스</h4>
        <div class="flex flex-wrap gap-1.5">${Object.entries(ROUTES).map(([id, rr]) =>
          `<button type="button" data-opt="route" data-val="${id}" class="px-3.5 py-2 rounded-full text-[13px] flex items-center gap-1.5 transition-all active:scale-95 ${id === state.route ? 'font-semibold text-ink-primary' : 'font-medium text-ink-secondary border border-[#e0e0e0]'}" style="${id === state.route ? `border:2px solid ${rr.color}` : ''}"><span class="w-2 h-2 rounded-full" style="background:${rr.color}"></span>${rr.label}</button>`).join('')}</div>
      </section>
      <section class="mt-5">
        <h4 class="text-[13px] font-semibold text-ink-muted mb-2">이동 수단</h4>
        ${seg('mode', MODES, state.mode)}
      </section>
      <section class="mt-5">
        <div class="flex items-center justify-between mb-2">
          <h4 class="text-[13px] font-semibold text-ink-muted">경유지</h4>
          <button type="button" data-opt="resetStops" class="text-[12px] text-primary font-medium">기본 코스로 되돌리기</button>
        </div>
        <div class="flex items-center gap-2 px-3 py-2.5 rounded-xl bg-canvas-parchment text-[13px] text-ink-secondary mb-2">
          <span class="w-2 h-2 rounded-full bg-[#34c759]"></span><span class="font-semibold text-ink-primary">${start.name}</span>
          <span class="material-symbols-outlined text-[16px] text-ink-muted">arrow_forward</span>
          <span class="material-symbols-outlined text-[14px] text-ink-muted">flag</span><span class="font-semibold text-ink-primary">${end.name}</span>
        </div>
        <div class="rounded-[18px] border border-[rgba(0,0,0,0.08)] overflow-hidden">${middle.map((id) => {
          const sp = SPOTS[id], on = stops.includes(id);
          return `<label class="flex items-center gap-3 px-3 py-2.5 border-b border-[rgba(0,0,0,0.06)] last:border-0 cursor-pointer">
            <span class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="background:${sp.color}1a;color:${sp.color}"><span class="material-symbols-outlined text-[17px]">${sp.icon}</span></span>
            <span class="flex flex-col flex-1 min-w-0"><span class="text-[14px] font-medium text-ink-primary truncate">${sp.name}</span><span class="text-[11px] text-ink-muted">${sp.cat} · ${sp.stay}분</span></span>
            <input type="checkbox" class="switch" data-opt="stop" data-val="${id}" ${on ? 'checked' : ''} aria-label="${sp.name} 경유">
          </label>`;
        }).join('')}</div>
      </section>
      <section class="mt-5">
        <h4 class="text-[13px] font-semibold text-ink-muted mb-2">지도 표시</h4>
        <label class="flex items-center justify-between px-3 py-2.5 rounded-xl bg-canvas-parchment mb-2 cursor-pointer">
          <span class="text-[14px] text-ink-primary">다른 코스 미리보기</span>
          <input type="checkbox" class="switch" data-opt="showOthers" ${state.showOthers ? 'checked' : ''}>
        </label>
        ${seg('mapStyle', MAP_STYLES, state.mapStyle)}
      </section>`;
  }
  $('#optionBody').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-opt]');
    if (!b) return;
    const { opt, val } = b.dataset;
    if (opt === 'route') setRoute(val);
    else if (opt === 'mode') { state.mode = val; renderSheet(); }
    else if (opt === 'mapStyle') { state.mapStyle = val; applyMapStyle(); }
    else if (opt === 'resetStops') { ROUTES[state.route].stops = [...DEFAULT_STOPS[state.route]]; renderAll(true); }
    renderOptionSheet();
    renderOptionSummary();
  });
  $('#optionBody').addEventListener('change', (e) => {
    const c = e.target;
    if (c.dataset.opt === 'stop') toggleStop(c.dataset.val);
    else if (c.dataset.opt === 'showOthers') { state.showOthers = c.checked; renderRoutes(false); }
    renderOptionSheet();
  });
  function renderOptionSummary() {
    const p = plan(), r = ROUTES[state.route];
    $('#optionSummary').innerHTML = `<div class="grid grid-cols-3 gap-2 p-2.5 rounded-2xl bg-canvas-parchment border border-[rgba(0,0,0,0.03)] text-center">
      <div class="flex flex-col"><span class="text-[11px] text-ink-muted">총 거리</span><span class="text-[15px] font-bold tracking-tight">${fmtDist(p.total)}</span></div>
      <div class="flex flex-col border-x border-[rgba(0,0,0,0.06)]"><span class="text-[11px] text-ink-muted">소요 시간</span><span class="text-[15px] font-bold tracking-tight">${fmtDur(p.duration)}</span></div>
      <div class="flex flex-col"><span class="text-[11px] text-ink-muted">예상 비용</span><span class="text-[15px] font-bold tracking-tight" style="color:${r.color}">${won(p.cost)}</span></div>

  }
  const openOptions = () => { renderOptionSheet(); renderOptionSummary(); openSheet('optionSheet'); };
  $('#btnLayers').addEventListener('click', openOptions);

  // ───── 기타 ─────
  let toastTimer;
  function toast(msg) {

  document.querySelectorAll('#regionChips button').forEach((b) => {
    const label = b.textContent.trim(); // 번역 전 원래 이름

    });
  });

  function renderAll(animate) {
    renderRoutePills();
    renderRoutes(animate);
    renderPins();
    renderSheet();
  }

  // ───── 지도 검색 ─────
  const searchInput = document.querySelector('input[placeholder="전국 한옥 & 고궁 코스 검색"]');
  if (searchInput) {
    const pill = searchInput.parentElement;
    pill.style.position = 'relative';
    pill.style.zIndex = '5'; // 아래 지역 칩보다 위에 결과 목록 표시
    pill.parentElement.style.zIndex = '30'; // 오른쪽 지도 버튼보다 위에 결과 목록 표시
    const drop = document.createElement('div');
    drop.id = 'mapSearchDrop';
    drop.className = 'hidden absolute left-0 right-0 top-[calc(100%+6px)] rounded-[18px] bg-white/95 backdrop-blur-xl border border-[rgba(0,0,0,0.08)] shadow-[0_12px_32px_rgba(0,0,0,0.12)] overflow-hidden max-h-[300px] overflow-y-auto z-30';
    pill.appendChild(drop);
    const OTHER = [['서울', '경복궁 북촌 서촌 광화문'], ['경주', '황리단길 대릉원 불국사'], ['안동', '하회마을 월영교']];
    const norm = (t) => t.toLowerCase().replace(/\s+/g, '');
    const row = (attrs, icon, color, title, sub, right = '') => `<button type="button" ${attrs} class="w-full flex items-center gap-3 px-3.5 py-2.5 text-left hover:bg-black/[0.03] active:bg-black/[0.06] border-b border-[rgba(0,0,0,0.05)] last:border-0">
        <span class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="background:${color}1a;color:${color}"><span class="material-symbols-outlined text-[17px]">${icon}</span></span>
        <span class="flex flex-col min-w-0 flex-1"><span class="text-[14px] font-medium text-ink-primary truncate">${title}</span><span class="text-[11px] text-ink-muted truncate">${sub}</span></span>${right}</button>`;
    function renderDrop() {
      const q = norm(searchInput.value);
      if (!q) { drop.classList.add('hidden'); return; }
      const spots = Object.entries(SPOTS).filter(([, sp]) => norm(sp.name + sp.cat + sp.desc).includes(q));
      const routes = Object.entries(ROUTES).filter(([, r]) => norm(r.label + r.title + r.sub).includes(q));
      const other = OTHER.filter(([n, kw]) => norm(n + kw).includes(q));
      let html = routes.map(([id, r]) => row(`data-route-pick="${id}"`, 'route', r.color, r.label, r.title)).join('')
        + spots.map(([id, sp]) => row(`data-spot-pick="${id}"`, sp.icon, sp.color, sp.name, `${sp.cat} · ${ROUTES[state.route].stops.includes(id) ? '현재 코스 포함' : '코스에 추가 가능'}`)).join('')
        + other.map(([n, kw]) => row(`data-soon-pick="${n}"`, 'location_city', '#8e8e93', n, kw.split(' ').join(' · '), '<span class="text-[11px] font-semibold text-ink-muted px-2 py-0.5 rounded-full bg-canvas-parchment">곧 오픈</span>')).join('');
      if (!html) html = `<div class="px-4 py-5 text-center text-[13px] text-ink-muted">'${searchInput.value.replace(/</g, '&lt;')}' 검색 결과가 없어요</div>`;
      drop.innerHTML = html;
      drop.classList.remove('hidden');
    }
    searchInput.addEventListener('focus', () => { searchInput.select(); renderDrop(); });
    searchInput.addEventListener('input', renderDrop);
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { drop.classList.add('hidden'); searchInput.blur(); }
      if (e.key === 'Enter') { const first = drop.querySelector('button'); if (first) first.click(); }
    });
    drop.addEventListener('mousedown', (e) => e.preventDefault()); // 클릭 전에 입력창 포커스가 빠지지 않게
    drop.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      drop.classList.add('hidden');
      searchInput.blur();
      if (b.dataset.routePick) { setRoute(b.dataset.routePick); searchInput.value = ROUTES[b.dataset.routePick].title; }
      else if (b.dataset.spotPick) { const id = b.dataset.spotPick; searchInput.value = SPOTS[id].name; focusSpot(id, 17.5); openSpot(id); }
      else if (b.dataset.soonPick) toast(`${b.dataset.soonPick} 지역 코스는 곧 열려요`);
    });
    document.addEventListener('click', (e) => { if (!pill.contains(e.target)) drop.classList.add('hidden'); });
    pill.querySelector('button[aria-label="음성 검색"]')?.addEventListener('click', () => toast('음성 검색은 준비 중이에요'));
  }

  applyMapStyle();
  fitRoute(false);
  renderAll(false);
  updateZoomButtons();

  // 다른 페이지 검색 결과에서 ?route= / ?spot= 으로 들어온 경우
  const params = new URLSearchParams(location.search);
  if (params.get('route') && ROUTES[params.get('route')]) setRoute(params.get('route'));
  if (params.get('spot') && SPOTS[params.get('spot')]) {
    const id = params.get('spot');
    setTimeout(() => { focusSpot(id, 17.5); openSpot(id); }, 300);
  }
  window.addEventListener('resize', () => { map.invalidateSize(); fitRoute(false); });
})();
</script>

<div id="regionPop" role="listbox" aria-label="지역 선택"></div>
<div id="regionToast" role="status" aria-live="polite"></div>
<script>
  (function () {
    const REGIONS = [
      { id: 'seoul', name: '서울', sub: '경복궁 · 북촌 한옥마을', icon: 'account_balance' },
      { id: 'jeonju', name: '전주', sub: '한옥마을 · 경기전', icon: 'holiday_village' },
      { id: 'gyeongju', name: '경주', sub: '황리단길 · 대릉원', icon: 'temple_buddhist' },
      { id: 'andong', name: '안동', sub: '하회마을 · 월영교', icon: 'park' },
    ];
    const btn = document.getElementById('regionBtn'), pop = document.getElementById('regionPop');
    const arrow = document.getElementById('regionArrow'), toastEl = document.getElementById('regionToast');
    if (!btn || !pop) return;
    // 현재 지역은 헤더 버튼의 data-current 로 정함 (기본: 서울)
    const currentId = btn.dataset.current || 'seoul';
    REGIONS.forEach((r) => { r.current = r.id === currentId; });

    pop.innerHTML = REGIONS.map((r) => `
      <button type="button" role="option" data-region="${r.id}" aria-selected="${!!r.current}" class="${r.current ? 'is-current' : ''}">
        <span class="r-icon material-symbols-outlined">${r.icon}</span>
        <span style="display:flex;flex-direction:column;flex:1;min-width:0"><span class="r-name">${r.name}</span><span class="r-sub">${r.sub}</span></span>
        ${r.current ? '<span class="material-symbols-outlined" style="font-size:18px;color:#0066cc">check</span>' : ''}
      </button>`).join('');

    function setOpen(open) {
      pop.classList.toggle('is-open', open);
      btn.setAttribute('aria-expanded', open);
      if (arrow) arrow.style.transform = open ? 'rotate(180deg)' : '';
      if (open) {
        const r = btn.getBoundingClientRect();
        pop.style.left = Math.max(12, r.left) + 'px';
        pop.style.top = (r.bottom + 8) + 'px';
      }
    }
    let toastTimer;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('is-show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('is-show'), 1800);
    }

    btn.addEventListener('click', (e) => { e.stopPropagation(); setOpen(!pop.classList.contains('is-open')); });
    pop.addEventListener('click', (e) => {
      const b = e.target.closest('[data-region]');
      if (!b) return;
      const r = REGIONS.find((x) => x.id === b.dataset.region);
      setOpen(false);
      if (!r.current) toast(`${r.name} 지역 코스는 곧 열려요`);
    });
    document.addEventListener('click', (e) => { if (!pop.contains(e.target)) setOpen(false); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
    window.addEventListener('scroll', () => setOpen(false), { passive: true });
  })();
</script>

<script>

    const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가 시 화면만 토글 */ } };
    const toastEl = document.getElementById('regionToast');
    let toastTimer;
    function toast(msg) {
      if (!toastEl) return;
      toastEl.textContent = msg; toastEl.classList.add('is-show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('is-show'), 1500);
    }
    function paint(btn, on, kind, label, onLabel, pop) {
      const icon = btn.querySelector('.material-symbols-outlined');
      btn.setAttribute('aria-pressed', on);
      btn.setAttribute('aria-label', on ? onLabel : label);
      btn.classList.toggle('is-toggled-' + kind, on);
      if (icon) {
        icon.style.fontVariationSettings = on ? "'FILL' 1" : "'FILL' 0";
        if (pop) { icon.classList.remove('toggle-pop'); void icon.offsetWidth; icon.classList.add('toggle-pop'); }
      }
    }

    // ── 하트: 카드의 상품 정보를 찜 목록에 저장 ──
    const cardInfo = (btn) => {
      const card = btn.closest('article') || btn.parentElement;
      const title = card.querySelector('h3, h4');
      const img = card.querySelector('img');
      const priceEl = [...card.querySelectorAll('span, div')].find((x) => /^₩[\d,]+/.test(x.textContent.trim()) && !/line-through/.test(x.className));
      const unit = card.textContent.includes('/일') ? '/일' : card.textContent.includes('/인') ? '/인' : '';
      return { name: title ? title.textContent.trim() : '한복', price: priceEl ? priceEl.textContent.trim().match(/₩[\d,]+/)[0] + unit : '', img: img ? img.src : '' };
    };
    document.querySelectorAll('button[aria-label="위시리스트 저장"]').forEach((btn) => {
      const info = cardInfo(btn);
      btn.type = 'button';
      paint(btn, load(WISH).some((w) => w.name === info.name), 'heart', '위시리스트 저장', '위시리스트에서 빼기');
      btn.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        let list = load(WISH);
        const on = !list.some((w) => w.name === info.name);
        list = on ? [{ ...info, at: Date.now() }, ...list] : list.filter((w) => w.name !== info.name);
        save(WISH, list);
        paint(btn, on, 'heart', '위시리스트 저장', '위시리스트에서 빼기', true);
        toast(on ? `위시리스트에 담았어요 · 찜 ${list.length}개` : '위시리스트에서 뺐어요');
      });
    });

    // ── 북마크(지도): 지금 보고 있는 코스를 저장 ──
    const bm = document.querySelector('button[aria-label="북마크 저장"]');
    const titleEl = document.getElementById('routeTitle');
    if (bm && titleEl) {
      const current = () => {
        const pill = document.querySelector('#routePills [aria-pressed="true"]');
        return { route: pill ? pill.dataset.route : '', label: pill ? pill.textContent.trim() : '', title: titleEl.textContent.trim(),
                 meta: [document.getElementById('sumDist')?.textContent, document.getElementById('sumTime')?.textContent].filter(Boolean).join(' · ') };
      };
      const sync = () => paint(bm, load(COURSES).some((c) => c.route === current().route), 'bookmark', '북마크 저장', '북마크 해제');
      bm.type = 'button';
      bm.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        const c = current();
        let list = load(COURSES);
        const on = !list.some((x) => x.route === c.route);
        list = on ? [{ ...c, at: Date.now() }, ...list] : list.filter((x) => x.route !== c.route);
        save(COURSES, list);
        paint(bm, on, 'bookmark', '북마크 저장', '북마크 해제', true);
        toast(on ? `'${c.title}' 코스를 저장했어요` : '저장을 취소했어요');
      });
      // 코스를 바꾸면 북마크 표시도 그 코스 기준으로
      new MutationObserver(sync).observe(titleEl, { childList: true, characterData: true, subtree: true });
      sync();
    }
  })();
</script>

<!-- 알림 팝오버 (헤더 종 아이콘) -->
<style>
  #notifPop { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 52px); right: 12px; z-index: 60; width: min(320px, calc(100vw - 24px)); border-radius: 18px; background: rgba(255, 255, 255, .94); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(0, 0, 0, .08); box-shadow: 0 12px 32px rgba(0, 0, 0, .12); opacity: 0; transform: translateY(-6px) scale(.98); transform-origin: calc(100% - 24px) 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Apple SD Gothic Neo', Inter, sans-serif; }
  #notifPop.is-open { opacity: 1; transform: none; pointer-events: auto; }
  #notifPop .n-item { display: flex; gap: 10px; padding: 11px 14px; border-top: 1px solid rgba(0, 0, 0, .06); text-align: left; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; cursor: pointer; transition: background-color .15s; }
  #notifPop .n-item:hover { background: rgba(0, 0, 0, .03); }
  #notifPop .n-item.is-unread { background: rgba(0, 102, 204, .05); }
  #notifPop .n-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; font-size: 17px; }
  #notifDot { transition: transform .2s ease, opacity .2s ease; animation: notifPulse 2s ease-in-out infinite; }
  #notifDot.is-read { transform: scale(0); opacity: 0; animation: none; }
  @keyframes notifPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, .45); } 50% { box-shadow: 0 0 0 4px rgba(255, 59, 48, 0); } }
  @media (prefers-reduced-motion: reduce) { #notifDot { animation: none; } }
</style>
<div id="notifPop" role="dialog" aria-label="알림"></div>
<script>
  (function () {
    const NOTIFS = [
      { icon: 'event_available', color: '#0066cc', title: '예약이 확정됐어요', body: '청자 옥빛 은박 당의 · 10월 18일 오전 10:00 픽업', time: '5분 전', href: '../profile/index.html' },
      { icon: 'auto_awesome', color: '#af52de', title: 'AI 체형 분석 완료', body: '나에게 맞는 실루엣 추천이 업데이트됐어요', time: '1시간 전', href: '../ai/index.html' },
      { icon: 'redeem', color: '#ff9500', title: '쿠폰이 도착했어요', body: '경복궁 별빛야행 한복 대여 20% 할인 쿠폰', time: '어제', href: '../shop/index.html' },
    ];
    const KEY = 'tripfit-notif-read';
    const btn = document.getElementById('notifBtn'), pop = document.getElementById('notifPop'), dot = document.getElementById('notifDot');
    if (!btn || !pop) return;
    let read = false;
    try { read = localStorage.getItem(KEY) === '1'; } catch (e) { /* 저장 불가 시 매번 새 알림으로 표시 */ }

    function render() {
      dot.classList.toggle('is-read', read);
      btn.setAttribute('aria-label', read ? '알림' : '알림 (새 알림 있음)');
      pop.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px">
          <span style="font-size:15px;font-weight:600;color:#1d1d1f;letter-spacing:-0.01em">알림</span>
          <span style="font-size:12px;color:${read ? '#86868b' : '#0066cc'};font-weight:500">${read ? '모두 읽음' : '새 알림 ' + NOTIFS.length + '개'}</span>
        </div>
        ${NOTIFS.map((n) => `
          <a class="n-item ${read ? '' : 'is-unread'}" href="${n.href}" style="text-decoration:none">
            <span class="n-icon material-symbols-outlined" style="background:${n.color}">${n.icon}</span>
            <span style="display:flex;flex-direction:column;min-width:0;flex:1">
              <span style="display:flex;align-items:center;justify-content:space-between;gap:8px">
                <span style="font-size:13px;font-weight:600;color:#1d1d1f">${n.title}</span>
                <span style="font-size:11px;color:#86868b;flex-shrink:0">${n.time}</span>
              </span>
              <span style="font-size:12px;color:#6e6e73;line-height:1.35;margin-top:1px">${n.body}</span>
            </span>
          </a>`).join('')}`;
    }
    function setOpen(open) {
      pop.classList.toggle('is-open', open);
      btn.setAttribute('aria-expanded', open);
      if (open) {
        const r = btn.getBoundingClientRect();
        pop.style.top = (r.bottom + 8) + 'px';
        pop.style.right = Math.max(12, window.innerWidth - r.right) + 'px';
      } else if (!read) {
        // 닫을 때 읽음 처리 → 빨간 점 사라짐 (다른 페이지에서도 유지)
        read = true;
        try { localStorage.setItem(KEY, '1'); } catch (e) { /* 무시 */ }
        render();
      }
    }
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const opening = !pop.classList.contains('is-open');
      if (opening) { // 지역 목록이 열려 있으면 닫기
        document.getElementById('regionPop')?.classList.remove('is-open');
        document.getElementById('regionBtn')?.setAttribute('aria-expanded', 'false');
        const arrow = document.getElementById('regionArrow'); if (arrow) arrow.style.transform = '';
      }
      setOpen(opening);
    });
    // 지역 버튼을 누르면 알림 닫기 (지역 버튼은 클릭 전파를 막아 문서 클릭으로는 안 닫힘)
    document.getElementById('regionBtn')?.addEventListener('click', () => { if (pop.classList.contains('is-open')) setOpen(false); });
    document.addEventListener('click', (e) => { if (pop.classList.contains('is-open') && !pop.contains(e.target)) setOpen(false); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && pop.classList.contains('is-open')) setOpen(false); });
    window.addEventListener('scroll', () => { if (pop.classList.contains('is-open')) setOpen(false); }, { passive: true });
    render();
  })();
</script>

<!-- 예약 버튼 → 예약 화면 연결 -->
<script>
  (function () {
    const go = (p) => { location.href = '../booking/index.html?' + new URLSearchParams(p); };
    // 카드 안 가격: 취소선(정가)이 아닌 첫 번째 '₩숫자' 글자
    const priceIn = (el) => {
      const cand = [...el.querySelectorAll('span, div')].filter((x) => /^₩[\d,]+/.test(x.textContent.trim()) && !/line-through/.test(x.className))
        .sort((a, b) => (b.className.includes('font-bold') ? 1 : 0) - (a.className.includes('font-bold') ? 1 : 0))[0];
      return cand ? cand.textContent.trim().match(/₩([\d,]+)/)[1].replace(/,/g, '') : '';
    };
    document.querySelectorAll('main button, main a').forEach((b) => {
      const label = b.textContent.replace(/\s+/g, ' ').trim();
      if (label === '피팅 예약' || label === '날짜 선택' || label === '상세 일정 확인') {
        b.addEventListener('click', (e) => {
          e.preventDefault(); e.stopPropagation();
          const card = b.closest('article');
          const title = card.querySelector('h3, h4');
          const img = card.querySelector('img');
          const sub = card.querySelector('span.text-\\[12px\\]');
          const isPack = label !== '피팅 예약';
          go({
            name: title ? title.textContent.trim() : '한복 대여', price: priceIn(card),
            unit: card.textContent.includes('/인') ? '/인' : card.textContent.includes('/일') ? '/일' : '',
            img: img ? img.src : '', kind: isPack ? 'pack' : 'rent',
            place: isPack && sub ? sub.textContent.trim() : '경복궁 미담한복 · 현장 수령',
          });
        });
      }
      if (label.startsWith('코스 패키지 지금 예약하기')) {
        b.addEventListener('click', () => go({
          name: document.getElementById('routeTitle').textContent.trim(),
          price: document.getElementById('sumCost').textContent.replace(/[^\d]/g, ''), unit: '/인', kind: 'course',
          place: '전주 한옥마을 · 온한복 본점 출발',
        }));
      }
    });
  })();
</script>
