<!DOCTYPE html>
<html lang="ko">
<head>
<title>0. TripFit 스플래시 (splash.html)</title>
<script src="../i18n.js"></script>
<!-- iOS 홈 화면 앱(PWA) 설정 -->
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../app-icon/apple-touch-icon.png">
<link rel="icon" type="image/png" href="../app-icon/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TripFit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">

<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<meta content="#ffffff" name="theme-color">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Apple SD Gothic Neo', Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
  }
  .splash {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
    transition: opacity .25s ease;
  }
  .splash.is-leaving { opacity: 0; }

  /* 워드마크: 화면 위쪽 1/3 지점 */
  .wordmark {
    margin-top: 27vh;
    font-size: 44px;
    font-weight: 600;
    letter-spacing: -0.035em;
    color: #8e8e93;
    opacity: 0;
    animation: rise .5s cubic-bezier(.2, .8, .2, 1) .05s forwards;
  }

  /* 엠블럼: 화면 가운데 아래쪽 */
  .emblem {
    margin-top: 13vh;
    width: 120px;
    height: 140px;
    opacity: 0;
    transform: scale(.92);
    animation: pop .5s cubic-bezier(.2, .8, .2, 1) .1s forwards;
  }
  .emblem .draw {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw .7s cubic-bezier(.4, 0, .2, 1) .15s forwards;
  }
  .emblem .spark {
    transform-origin: 104px 18px;
    transform: scale(0);
    animation: spark .35s cubic-bezier(.2, .8, .2, 1.4) .6s forwards;
  }

  .copyright {
    margin-top: auto;
    margin-bottom: 9vh;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #3a3a3c;
  }
  .copyright .c {
    width: 16px;
    height: 16px;
    border: 1.5px solid #3a3a3c;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 600;
    box-sizing: border-box;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pop { to { opacity: 1; transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes spark { to { transform: scale(1); } }

  @media (prefers-reduced-motion: reduce) {
    .wordmark, .emblem, .emblem .draw, .emblem .spark { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0; }
  }
</style>
<!-- 페이지 전환: 하단 탭바로 이동할 때만 탭 순서에 따라 옆으로 슬라이드 (View Transitions, 미지원 브라우저는 들어오는 쪽만 슬라이드) -->
<style>
  @view-transition { navigation: auto; }
  header { view-transition-name: tf-header; }
  nav.fixed { view-transition-name: tf-tabbar; }
  ::view-transition-group(tf-header), ::view-transition-group(tf-tabbar) { animation-duration: .2s; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .38s; animation-timing-function: cubic-bezier(.32, .72, 0, 1); animation-fill-mode: both; }
  /* 앞으로: 두 화면이 나란히 붙은 채 왼쪽으로 함께 넘어감 (이전 화면 → 왼쪽 밖, 새 화면 ← 오른쪽에서) */
  html:active-view-transition-type(tf-forward)::view-transition-old(root) { animation-name: tf-push-out; }
  html:active-view-transition-type(tf-forward)::view-transition-new(root) { animation-name: tf-slide-in; }
  /* 뒤로: 두 화면이 나란히 붙은 채 오른쪽으로 함께 넘어감 */
  html:active-view-transition-type(tf-back)::view-transition-old(root) { animation-name: tf-slide-out; }
  html:active-view-transition-type(tf-back)::view-transition-new(root) { animation-name: tf-pop-in; }
  @keyframes tf-slide-in { from { transform: translateX(100%); } }
  @keyframes tf-push-out { to { transform: translateX(-100%); } }
  @keyframes tf-slide-out { to { transform: translateX(100%); } }
  @keyframes tf-pop-in { from { transform: translateX(-100%); } }
  /* 미지원 브라우저용: 새 화면 본문만 옆에서 들어옴 */
  html.tf-enter-forward main { animation: tf-fb-right .38s cubic-bezier(.32, .72, 0, 1) both; }
  html.tf-enter-back main { animation: tf-fb-left .38s cubic-bezier(.32, .72, 0, 1) both; }
  @keyframes tf-fb-right { from { transform: translateX(40px); opacity: 0; } }
  @keyframes tf-fb-left { from { transform: translateX(-40px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    @view-transition { navigation: none; }
    html.tf-enter-forward main, html.tf-enter-back main { animation: none; }
  }
</style>
<script>
  (function () {
    // 하단 탭바로 이동할 때만 탭 순서대로 슬라이드. 그 외 이동(버튼·뒤로 가기·자동 이동)은 전환 없이 바로 바뀜
    const ORDER = { home: 0, 'ai': 1, map: 2, shop: 3 };
    const pageOf = (url) => { try { const parts = new URL(url, location.href).pathname.split('/'); return decodeURIComponent(parts[parts.length - 2] || ''); } catch (e) { return ''; } };
    const KEY = 'tf-nav-dir';
    const take = () => { try { const v = sessionStorage.getItem(KEY); sessionStorage.removeItem(KEY); return v; } catch (e) { return null; } };

    // 탭바 링크를 누른 순간 방향을 기록
    document.addEventListener('click', (e) => {
      const a = e.target.closest && e.target.closest('nav.fixed a[href]');
      if (!a) return;
      const from = ORDER[pageOf(location.href)], to = ORDER[pageOf(a.href)];
      if (from === undefined || to === undefined || from === to) return;
      try { sessionStorage.setItem(KEY, to > from ? 'tf-forward' : 'tf-back'); } catch (err) { /* 무시 */ }
    }, true);

    // 지원 브라우저: 탭바 이동이면 방향 타입 지정, 아니면 전환 생략
    window.addEventListener('pageswap', (e) => {
      if (!e.viewTransition) return;
      e.viewTransition.ready.catch(() => {});
      let dir = null;
      try { dir = sessionStorage.getItem(KEY); } catch (err) { /* 무시 */ }
      if (dir) e.viewTransition.types.add(dir); else e.viewTransition.skipTransition();
    });
    window.addEventListener('pagereveal', (e) => {
      if (!e.viewTransition) return;
      e.viewTransition.ready.catch(() => {});
      const dir = take();
      if (dir) e.viewTransition.types.add(dir); else e.viewTransition.skipTransition();
    });

    // 미지원 브라우저: 탭바로 들어온 경우만 본문을 옆에서 슬라이드
    if (!('CSSViewTransitionRule' in window)) {
      const dir = take();
      if (dir === 'tf-forward') document.documentElement.classList.add('tf-enter-forward');
      if (dir === 'tf-back') document.documentElement.classList.add('tf-enter-back');
    }
  })();
</script>
</head>
<body>
<main class="splash" id="splash" aria-label="TripFit 시작 화면">
  <div class="wordmark">TripFit</div>

  <!-- 로고: 위치 핀(여행) 안의 옷걸이(핏) + 반짝임 -->
  <svg class="emblem" viewBox="0 0 120 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TripFit 로고">
    <defs>
      <linearGradient id="brand" x1="14" y1="8" x2="106" y2="130" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#0066cc"/>
        <stop offset="1" stop-color="#30b0c7"/>
      </linearGradient>
    </defs>
    <path class="draw" pathLength="1" d="M60 10C34.5 10 15 29.5 15 54.5C15 86 60 128 60 128C60 128 105 86 105 54.5C105 29.5 85.5 10 60 10Z"
          stroke="url(#brand)" stroke-width="7" stroke-linejoin="round"/>
    <path class="draw" pathLength="1" d="M53.5 39.5A6.5 6.5 0 1 1 60 46V51.5L35.5 69.5C33 71.3 34.2 74 37 74H83C85.8 74 87 71.3 84.5 69.5L60 51.5"
          stroke="url(#brand)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="spark" d="M104 6C105 13 106.5 15 113 18C106.5 21 105 23 104 30C103 23 101.5 21 95 18C101.5 15 103 13 104 6Z" fill="#30b0c7"/>
  </svg>

  <div class="copyright"><span class="c">C</span>TRIPFIT</div>
</main>
<script>
  // 로고 등장(약 0.7초)이 끝난 뒤 1초 더 보여주고 홈으로 이동 (뒤로 가기 시 스플래시로 돌아오지 않도록 replace)
  // 화면이 실제로 보일 때부터 시간을 잼: 숨겨진 탭에서는 애니메이션이 멈춰 로고를 못 보고 넘어가는 문제 방지
  // 주소 끝에 ?stay 를 붙이면 넘어가지 않고 화면에 머무름 (디자인 확인용)
  const HOME = '../home/index.html';
  const SHOW_MS = 700 + 1000;
  function startTimer() {
    setTimeout(() => {
      document.getElementById('splash').classList.add('is-leaving');
      setTimeout(() => location.replace(HOME), 250);
    }, SHOW_MS);
  }
  if (!new URLSearchParams(location.search).has('stay')) {
    if (document.visibilityState === 'visible') startTimer();
    else document.addEventListener('visibilitychange', function onVisible() {
      if (document.visibilityState !== 'visible') return;
      document.removeEventListener('visibilitychange', onVisible);
      startTimer();
    });
  }
</script>
</body>
</html>
